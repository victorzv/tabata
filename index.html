<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Табата">
<link rel="manifest" href="manifest.json">
<title>Табата Таймер</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Unbounded:wght@300;500;700&display=swap');

:root {
  --work: #00ff87;
  --rest: #ff6b35;
  --bg: #0a0a0a;
  --card: #141414;
  --card2: #1e1e1e;
  --text: #f0f0f0;
  --muted: #666;
  --border: #2a2a2a;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  font-family: 'Space Mono', monospace;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
}

body { display: flex; flex-direction: column; }

/* SCREENS */
.screen { display: none; flex-direction: column; height: 100dvh; }
.screen.active { display: flex; }

/* ─── SETUP SCREEN ─── */
#setupScreen {
  padding: 0;
  overflow-y: auto;
}

.setup-header {
  padding: 2rem 1.5rem 1rem;
  background: var(--bg);
  position: sticky; top: 0; z-index: 10;
  border-bottom: 1px solid var(--border);
}

.app-title {
  font-family: 'Unbounded', sans-serif;
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--work);
}

.setup-body { padding: 1.5rem; flex: 1; }

.section-label {
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 0.75rem;
  margin-top: 1.5rem;
}
.section-label:first-child { margin-top: 0; }

/* rounds selector */
.rounds-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.round-btn {
  flex: 1;
  min-width: 48px;
  padding: 0.75rem 0;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--muted);
  font-family: 'Space Mono', monospace;
  font-size: 1rem;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
}
.round-btn.sel {
  background: var(--work);
  color: #000;
  border-color: var(--work);
  font-weight: 700;
}

/* exercise cards */
.ex-list { display: flex; flex-direction: column; gap: 10px; }

.ex-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 1rem;
  display: flex;
  align-items: center;
  gap: 12px;
  position: relative;
}

.ex-num {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--card2);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.75rem;
  color: var(--muted);
  flex-shrink: 0;
}

.ex-fields { flex: 1; display: flex; flex-direction: column; gap: 6px; }

.ex-name-input {
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--border);
  color: var(--text);
  font-family: 'Space Mono', monospace;
  font-size: 0.85rem;
  padding: 4px 0;
  width: 100%;
  outline: none;
}
.ex-name-input:focus { border-bottom-color: var(--work); }

.ex-meta {
  font-size: 0.65rem;
  color: var(--muted);
  letter-spacing: 0.05em;
}

.ex-remove {
  background: none;
  border: none;
  color: var(--muted);
  font-size: 1.2rem;
  cursor: pointer;
  padding: 4px;
  line-height: 1;
}
.ex-remove:hover { color: var(--rest); }

/* interval mode cards */
.mode-list { display: flex; flex-direction: column; gap: 8px; }

.mode-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 0.875rem 1rem;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  display: flex;
  align-items: center;
  gap: 12px;
}
.mode-card.sel {
  border-color: var(--work);
  background: #001a0e;
}
.mode-card-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  border: 1.5px solid var(--muted);
  flex-shrink: 0;
  transition: background 0.15s, border-color 0.15s;
}
.mode-card.sel .mode-card-dot {
  background: var(--work);
  border-color: var(--work);
}
.mode-card-body { flex: 1; }
.mode-card-title {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 2px;
}
.mode-card.sel .mode-card-title { color: var(--work); }
.mode-card-times {
  font-size: 0.7rem;
  color: var(--muted);
  letter-spacing: 0.05em;
  margin-bottom: 3px;
}
.mode-card-desc {
  font-size: 0.68rem;
  color: var(--muted);
  line-height: 1.5;
}
.mode-card-badge {
  font-size: 0.6rem;
  padding: 3px 8px;
  border-radius: 20px;
  background: #001a0e;
  color: var(--work);
  border: 1px solid var(--work);
  flex-shrink: 0;
  letter-spacing: 0.05em;
}
.mode-card.sel .mode-card-badge {
  background: var(--work);
  color: #000;
}

.add-ex-btn {
  width: 100%;
  padding: 0.875rem;
  background: transparent;
  border: 1px dashed var(--border);
  border-radius: 14px;
  color: var(--muted);
  font-family: 'Space Mono', monospace;
  font-size: 0.8rem;
  cursor: pointer;
  margin-top: 8px;
  transition: all 0.15s;
}
.add-ex-btn:hover { border-color: var(--work); color: var(--work); }

/* sound toggle */
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 0.875rem 1rem;
}

.toggle-label { font-size: 0.8rem; color: var(--text); }
.toggle-sub { font-size: 0.65rem; color: var(--muted); margin-top: 2px; }

.toggle-switch {
  width: 48px; height: 26px;
  background: var(--border);
  border-radius: 13px;
  position: relative;
  cursor: pointer;
  transition: background 0.2s;
  flex-shrink: 0;
}
.toggle-switch.on { background: var(--work); }
.toggle-switch::after {
  content: '';
  position: absolute;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: #fff;
  top: 3px; left: 3px;
  transition: transform 0.2s;
}
.toggle-switch.on::after { transform: translateX(22px); }

.start-btn {
  width: 100%;
  padding: 1.1rem;
  background: var(--work);
  border: none;
  border-radius: 14px;
  color: #000;
  font-family: 'Unbounded', sans-serif;
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  cursor: pointer;
  margin-top: 1.5rem;
  margin-bottom: 2rem;
  transition: transform 0.1s, opacity 0.1s;
}
.start-btn:active { transform: scale(0.97); opacity: 0.9; }

/* ─── TIMER SCREEN ─── */
#timerScreen {
  justify-content: space-between;
  padding: 0;
  position: relative;
  overflow: hidden;
}

.timer-bg {
  position: absolute;
  inset: 0;
  opacity: 0.04;
  transition: background 0.3s;
  pointer-events: none;
}
.timer-bg.work { background: var(--work); opacity: 0.07; }
.timer-bg.rest { background: var(--rest); opacity: 0.07; }

.timer-top {
  padding: 3rem 1.5rem 1rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  position: relative;
  z-index: 1;
}

.phase-tag {
  font-size: 0.65rem;
  letter-spacing: 0.25em;
  padding: 4px 14px;
  border-radius: 20px;
  border: 1px solid;
  text-transform: uppercase;
  transition: all 0.3s;
}
.phase-tag.work { color: var(--work); border-color: var(--work); }
.phase-tag.rest { color: var(--rest); border-color: var(--rest); }
.phase-tag.ready { color: var(--muted); border-color: var(--muted); }

.ex-display {
  font-family: 'Unbounded', sans-serif;
  font-size: 1.4rem;
  font-weight: 500;
  text-align: center;
  line-height: 1.3;
  margin-top: 0.5rem;
}

.ex-display-sub {
  font-size: 0.75rem;
  color: var(--muted);
  text-align: center;
}

/* Big timer */
.timer-center {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 1;
}

.big-time {
  font-family: 'Unbounded', sans-serif;
  font-size: clamp(5rem, 30vw, 8rem);
  font-weight: 700;
  line-height: 1;
  transition: color 0.3s;
}
.big-time.work { color: var(--work); }
.big-time.rest { color: var(--rest); }
.big-time.ready { color: var(--muted); }

/* Progress bar */
.progress-track {
  width: 85%;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin-top: 1.5rem;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.95s linear, background 0.3s;
}
.progress-fill.work { background: var(--work); }
.progress-fill.rest { background: var(--rest); }

/* Dots */
.dots-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 1.5rem;
  max-width: 90%;
}
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--border);
  transition: background 0.3s, transform 0.3s;
}
.dot.done { background: var(--work); }
.dot.current { background: var(--work); transform: scale(1.5); }
.dot.rest-done { background: var(--muted); }

/* Bottom controls */
.timer-bottom {
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: relative;
  z-index: 1;
}

.block-progress {
  display: flex;
  gap: 6px;
}
.block-seg {
  flex: 1;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  transition: background 0.3s;
}
.block-seg.done { background: var(--work); }
.block-seg.active { background: var(--rest); }

.round-info {
  text-align: center;
  font-size: 0.7rem;
  color: var(--muted);
  letter-spacing: 0.1em;
}

.ctrl-row { display: flex; gap: 10px; }

.ctrl-btn {
  flex: 1;
  padding: 1rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  color: var(--text);
  font-family: 'Space Mono', monospace;
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.15s;
  text-align: center;
}
.ctrl-btn:active { transform: scale(0.96); }
.ctrl-btn.primary {
  background: var(--work);
  border-color: var(--work);
  color: #000;
  font-weight: 700;
}
.ctrl-btn.primary.paused {
  background: var(--card);
  border-color: var(--work);
  color: var(--work);
}

/* Done screen */
#doneScreen {
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 2rem;
}
.done-icon { font-size: 4rem; margin-bottom: 1rem; }
.done-title {
  font-family: 'Unbounded', sans-serif;
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--work);
  margin-bottom: 0.5rem;
}
.done-sub { font-size: 0.8rem; color: var(--muted); margin-bottom: 2rem; line-height: 1.7; }
.done-btn {
  padding: 1rem 2.5rem;
  background: var(--work);
  border: none;
  border-radius: 14px;
  color: #000;
  font-family: 'Unbounded', sans-serif;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
}
</style>
</head>
<body>

<!-- ═══ SETUP ═══ -->
<div id="setupScreen" class="screen active">
  <div class="setup-header">
    <div class="app-title">ТАБАТА</div>
  </div>
  <div class="setup-body">

    <div class="section-label">Режим интервалов</div>
    <div class="mode-list" id="modeList"></div>

    <div class="section-label">Раундов на упражнение</div>
    <div class="rounds-row" id="roundsBtns">
      <button class="round-btn" onclick="selRounds(2)">2</button>
      <button class="round-btn sel" onclick="selRounds(4)">4</button>
      <button class="round-btn" onclick="selRounds(6)">6</button>
      <button class="round-btn" onclick="selRounds(8)">8</button>
    </div>

    <div class="section-label">Упражнения</div>
    <div class="ex-list" id="exList"></div>
    <button class="add-ex-btn" onclick="addExercise()">+ добавить упражнение</button>

    <div class="section-label">Звук</div>
    <div class="toggle-row">
      <div>
        <div class="toggle-label">Звуковые сигналы</div>
        <div class="toggle-sub">Старт / конец фазы / финиш</div>
      </div>
      <div class="toggle-switch on" id="soundToggle" onclick="toggleSound()"></div>
    </div>

    <button class="start-btn" onclick="startWorkout()">НАЧАТЬ ТРЕНИРОВКУ</button>
  </div>
</div>

<!-- ═══ TIMER ═══ -->
<div id="timerScreen" class="screen">
  <div class="timer-bg" id="timerBg"></div>

  <div class="timer-top">
    <div class="phase-tag ready" id="phaseTag">ГОТОВ</div>
    <div class="ex-display" id="exDisplay">—</div>
    <div class="ex-display-sub" id="exSub"></div>
  </div>

  <div class="timer-center">
    <div class="big-time ready" id="bigTime">20</div>
    <div class="progress-track">
      <div class="progress-fill work" id="progressFill" style="width:100%"></div>
    </div>
    <div class="dots-row" id="dotsRow"></div>
  </div>

  <div class="timer-bottom">
    <div class="block-progress" id="blockProgress"></div>
    <div class="round-info" id="roundInfo">Блок 1 · Раунд 1</div>
    <div class="ctrl-row">
      <button class="ctrl-btn" onclick="goSetup()">← Назад</button>
      <button class="ctrl-btn primary" id="playBtn" onclick="togglePlay()">▶ Старт</button>
    </div>
  </div>
</div>

<!-- ═══ DONE ═══ -->
<div id="doneScreen" class="screen">
  <div class="done-icon">💪</div>
  <div class="done-title">Готово!</div>
  <div class="done-sub" id="doneSub"></div>
  <button class="done-btn" onclick="goSetup()">Ещё раз</button>
</div>

<script>
// ── State ──
let exercises = [
  { name: 'Приседания (без прыжка)' },
  { name: 'TRX-тяга к груди' },
  { name: 'Жим гантелей стоя' }
];
let rounds = 4;
let soundOn = true;
let timer = null;
let running = false;
let WORK = 20, REST = 40;
let state = { block: 0, round: 0, phase: 'idle', sec: WORK };
let totalDone = 0;

const MODES = [
  {
    id: 'rehab',
    title: 'Реабилитация',
    work: 20, rest: 40,
    badge: 'РЕКОМЕНДУЮ',
    desc: 'Мягкий старт. Отдых вдвое длиннее работы — пульс успевает восстановиться. Для гипертонии стрессового типа, после болезни, абсолютных новичков.'
  },
  {
    id: 'cardio_soft',
    title: 'Мягкое кардио',
    work: 30, rest: 30,
    badge: 'НАЧАЛЬНЫЙ',
    desc: 'Работа и отдых поровну. Хорошая аэробная нагрузка без экстремального пульса. Следующий шаг после реабилитации.'
  },
  {
    id: 'classic_light',
    title: 'Табата лёгкая',
    work: 30, rest: 15,
    badge: 'СРЕДНИЙ',
    desc: 'Соотношение 2:1, но более щадящее. Хорошо подходит когда уже есть базовая подготовка, но классика ещё тяжела.'
  },
  {
    id: 'classic',
    title: 'Классическая табата',
    work: 20, rest: 10,
    badge: 'КЛАССИКА',
    desc: 'Оригинальный протокол Табаты 1996 года. Очень интенсивно. Подходит подготовленным.'
  },
  {
    id: 'power',
    title: 'Силовая табата',
    work: 40, rest: 20,
    badge: 'ПРОДВИНУТЫЙ',
    desc: 'Соотношение 2:1 с длинными подходами. Для силовых упражнений с весом, когда нужно больше времени на технику.'
  }
];

let selectedMode = 'rehab';

function renderModes() {
  const list = document.getElementById('modeList');
  list.innerHTML = '';
  MODES.forEach(m => {
    const card = document.createElement('div');
    card.className = 'mode-card' + (m.id === selectedMode ? ' sel' : '');
    card.onclick = () => selMode(m.id);
    card.innerHTML = `
      <div class="mode-card-dot"></div>
      <div class="mode-card-body">
        <div class="mode-card-title">${m.title}</div>
        <div class="mode-card-times">${m.work} сек работа · ${m.rest} сек отдых · соотношение 1:${(m.rest/m.work).toFixed(1).replace('.0','')}</div>
        <div class="mode-card-desc">${m.desc}</div>
      </div>
      <div class="mode-card-badge">${m.badge}</div>`;
    list.appendChild(card);
  });
}

function selMode(id) {
  selectedMode = id;
  const m = MODES.find(x => x.id === id);
  WORK = m.work;
  REST = m.rest;
  renderModes();
  renderExList();
}

// ── Audio ──
const ctx = new (window.AudioContext || window.webkitAudioContext)();

function beep(freq, dur, vol = 0.4) {
  if (!soundOn) return;
  try {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = freq;
    o.type = 'sine';
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.start(); o.stop(ctx.currentTime + dur);
  } catch(e) {}
}

function beepWork() { beep(880, 0.15); setTimeout(() => beep(880, 0.15), 180); }
function beepRest() { beep(440, 0.3); }
function beepDone() {
  [0, 150, 300, 500].forEach((d, i) => setTimeout(() => beep(660 + i*110, 0.25), d));
}
function beepCount() { beep(660, 0.08, 0.2); }

// ── Setup ──
function renderExList() {
  const list = document.getElementById('exList');
  list.innerHTML = '';
  exercises.forEach((ex, i) => {
    const card = document.createElement('div');
    card.className = 'ex-card';
    card.innerHTML = `
      <div class="ex-num">${i+1}</div>
      <div class="ex-fields">
        <input class="ex-name-input" value="${ex.name}" placeholder="Название упражнения"
          oninput="exercises[${i}].name=this.value">
        <div class="ex-meta">блок ${i+1} · ${rounds} × ${WORK}сек работа / ${REST}сек отдых</div>
      </div>
      <button class="ex-remove" onclick="removeEx(${i})">×</button>`;
    list.appendChild(card);
  });
}

function addExercise() {
  exercises.push({ name: '' });
  renderExList();
  setTimeout(() => {
    const inputs = document.querySelectorAll('.ex-name-input');
    inputs[inputs.length-1].focus();
  }, 50);
}

function removeEx(i) {
  if (exercises.length <= 1) return;
  exercises.splice(i, 1);
  renderExList();
}

function selRounds(n) {
  rounds = n;
  document.querySelectorAll('.round-btn').forEach(b => {
    b.classList.toggle('sel', parseInt(b.textContent) === n);
  });
  renderExList();
}

function toggleSound() {
  soundOn = !soundOn;
  document.getElementById('soundToggle').classList.toggle('on', soundOn);
  if (soundOn) { ctx.resume(); beepWork(); }
}

// ── Start ──
function startWorkout() {
  if (exercises.some(e => !e.name.trim())) {
    alert('Введи название для каждого упражнения');
    return;
  }
  ctx.resume();
  state = { block: 0, round: 0, phase: 'idle', sec: WORK };
  totalDone = 0;
  running = false;
  buildDots();
  buildBlockProgress();
  updateTimerUI();
  showScreen('timerScreen');
}

function buildDots() {
  const row = document.getElementById('dotsRow');
  row.innerHTML = '';
  for (let i = 0; i < rounds; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = `dot-${i}`;
    row.appendChild(d);
  }
}

function buildBlockProgress() {
  const bp = document.getElementById('blockProgress');
  bp.innerHTML = '';
  exercises.forEach((_, i) => {
    const s = document.createElement('div');
    s.className = 'block-seg';
    s.id = `bseg-${i}`;
    bp.appendChild(s);
  });
}

// ── Timer ──
function togglePlay() {
  ctx.resume();
  if (state.phase === 'idle') {
    state.phase = 'work';
    beepWork();
  }
  running = !running;
  if (running) {
    timer = setInterval(tick, 1000);
    document.getElementById('playBtn').textContent = '⏸ Пауза';
    document.getElementById('playBtn').classList.remove('paused');
  } else {
    clearInterval(timer);
    document.getElementById('playBtn').textContent = '▶ Продолжить';
    document.getElementById('playBtn').classList.add('paused');
  }
  updateTimerUI();
}

function tick() {
  state.sec--;
  if (state.sec <= 3 && state.sec > 0 && state.phase === 'work') beepCount();
  if (state.sec <= 0) nextPhase();
  else updateTimerUI();
}

function nextPhase() {
  if (state.phase === 'work') {
    state.phase = 'rest';
    state.sec = REST;
    beepRest();
  } else {
    totalDone++;
    state.round++;
    if (state.round >= rounds) {
      state.round = 0;
      state.block++;
      if (state.block >= exercises.length) {
        finish(); return;
      }
    }
    state.phase = 'work';
    state.sec = WORK;
    beepWork();
  }
  updateTimerUI();
}

function updateTimerUI() {
  const isWork = state.phase === 'work';
  const isRest = state.phase === 'rest';
  const isIdle = state.phase === 'idle';
  const ex = exercises[state.block];

  document.getElementById('phaseTag').textContent = isWork ? 'РАБОТА' : isRest ? 'ОТДЫХ' : 'СТАРТ';
  document.getElementById('phaseTag').className = 'phase-tag ' + (isWork ? 'work' : isRest ? 'rest' : 'ready');
  document.getElementById('exDisplay').textContent = ex ? ex.name : '—';

  if (isRest && state.block < exercises.length - 1 && state.round === rounds - 1) {
    document.getElementById('exSub').textContent = '→ следующий: ' + exercises[state.block + 1].name;
  } else {
    document.getElementById('exSub').textContent = `блок ${state.block+1} из ${exercises.length}`;
  }

  document.getElementById('bigTime').textContent = isIdle ? WORK : state.sec;
  document.getElementById('bigTime').className = 'big-time ' + (isWork ? 'work' : isRest ? 'rest' : 'ready');

  document.getElementById('timerBg').className = 'timer-bg ' + (isWork ? 'work' : isRest ? 'rest' : '');

  const total = isWork || isIdle ? WORK : REST;
  const pct = ((isIdle ? WORK : state.sec) / total) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressFill').className = 'progress-fill ' + (isRest ? 'rest' : 'work');

  document.getElementById('roundInfo').textContent =
    `Блок ${state.block+1} · Раунд ${state.round+1} из ${rounds}`;

  // dots
  for (let i = 0; i < rounds; i++) {
    const d = document.getElementById(`dot-${i}`);
    if (!d) continue;
    if (i < state.round) d.className = 'dot done';
    else if (i === state.round) d.className = 'dot current';
    else d.className = 'dot';
  }

  // block segments
  exercises.forEach((_, i) => {
    const s = document.getElementById(`bseg-${i}`);
    if (!s) return;
    if (i < state.block) s.className = 'block-seg done';
    else if (i === state.block) s.className = 'block-seg active';
    else s.className = 'block-seg';
  });

  if (!running && state.phase !== 'idle') {
    document.getElementById('playBtn').textContent = '▶ Продолжить';
    document.getElementById('playBtn').classList.add('paused');
  } else if (state.phase === 'idle') {
    document.getElementById('playBtn').textContent = '▶ Старт';
    document.getElementById('playBtn').classList.remove('paused');
  }
}

function finish() {
  clearInterval(timer);
  running = false;
  beepDone();
  const total = exercises.length * rounds;
  const secs = total * (WORK + REST);
  const mins = Math.round(secs / 60);
  const m = MODES.find(x => x.id === selectedMode);
  document.getElementById('doneSub').textContent =
    `${m.title} · ${WORK}с/${REST}с\n${exercises.length} упражнения · ${rounds} раундов\n~${mins} минут`;
  showScreen('doneScreen');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goSetup() {
  clearInterval(timer);
  running = false;
  showScreen('setupScreen');
  renderExList();
}

// init
renderModes();
selMode('rehab');
renderExList();
</script>
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
